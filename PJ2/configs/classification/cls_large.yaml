seed: 42
id: cls_large

data:
  data_dir: ./data
  val_size: 5000
  batch_size: 512
  num_workers: 4
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2470, 0.2435, 0.2616]

model:
  channels: [96, 192, 384, 640]
  blocks_per_stage: [2, 2, 2, 2]
  hidden_dim: 768
  activation: relu
  use_batchnorm: true
  dropout: 0.2
  use_residual: true

train:
  epochs: 50
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0005
  scheduler: cosine
  loss: cross_entropy
  label_smoothing: 0.0
  use_amp: true
