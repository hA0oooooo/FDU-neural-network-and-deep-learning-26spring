seed: 42
id: cls_no_normalize

data:
  data_dir: ./data
  val_size: 5000
  batch_size: 512
  num_workers: 4
  mean: null
  std: null

model:
  channels: [64, 128, 256, 512]
  blocks_per_stage: [2, 2, 2, 2]
  hidden_dim: 512
  activation: relu
  use_batchnorm: true
  dropout: 0.2
  use_residual: true

train:
  epochs: 50
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0005
  scheduler: cosine
  loss: cross_entropy
  label_smoothing: 0.0
  use_amp: true
